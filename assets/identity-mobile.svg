<text x="30" y="91" font-size="28" fill="#EAF8FF" font-weight="650">Desarrollo y digitalización.</text><text x="30" y="127" font-size="20" fill="#9EBBCB" >Aplicaciones, datos</text><text x="30" y="155" font-size="20" fill="#9EBBCB" >y procesos de negocio.</text><rect x="30" y="183" width="420" height="119" rx="10" fill="#0B1B27" stroke="#234755"/><g transform="translate(49 206)" stroke="#66DCE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="42" height="29" rx="4"/><path d="M0 8H42M14 16L9 20L14 24M27 16L32 20L27 24M23 14L19 26"/><path class="pulse" d="M6 4H12"/></g><text x="108" y="214" font-size="10" fill="#6AB8C8" class="mono" letter-spacing="1.7" >DESARROLLO</text><text x="108" y="244" font-size="22" fill="#E2F2F9" font-weight="600">Web · Móvil · Escritorio</text><text x="108" y="274" font-size="17" fill="#9EBBCB" >Desarrollo de aplicaciones.</text><rect x="30" y="317" width="420" height="119" rx="10" fill="#0B1B27" stroke="#234755"/><g transform="translate(49 340)" fill="#61DBE7"><rect class="rise" y="18" width="7" height="17" rx="2"/><rect class="rise delay" x="13" y="9" width="7" height="26" rx="2"/><rect class="rise delay2" x="26" width="7" height="35" rx="2"/></g><text x="108" y="348" font-size="10" fill="#6AB8C8" class="mono" letter-spacing="1.7" >DATOS</text><text x="108" y="378" font-size="22" fill="#E2F2F9" font-weight="600">Análisis y visualización</text><text x="108" y="408" font-size="17" fill="#9EBBCB" >Organización de información.</text><rect x="30" y="451" width="420" height="119" rx="10" fill="#0B1B27" stroke="#234755"/><g transform="translate(49 474)" stroke="#66DCE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path class="flow" d="M7 6L33 6L20 30Z"/><circle cx="7" cy="6" r="5" fill="#0A1C28"/><circle cx="33" cy="6" r="5" fill="#0A1C28"/><circle class="pulse" cx="20" cy="30" r="5" fill="#0A1C28"/></g><text x="108" y="482" font-size="10" fill="#6AB8C8" class="mono" letter-spacing="1.7" >FORMACIÓN</text><text x="108" y="512" font-size="22" fill="#E2F2F9" font-weight="600">Ingeniería de Sistemas</text><text x="108" y="542" font-size="17" fill="#9EBBCB" >Redes y ciberseguridad.</text><rect x="30" y="585" width="420" height="119" rx="10" fill="#0B1B27" stroke="#234755"/><g transform="translate(49 608)" stroke="#66DCE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="19" r="17"/><circle class="pulse" cx="20" cy="19" r="9"/><path d="M20 19L38 1M28 1H38V11"/></g><text x="108" y="616" font-size="10" fill="#6AB8C8" class="mono" letter-spacing="1.7" >MARKETING DIGITAL</text><text x="108" y="646" font-size="22" fill="#E2F2F9" font-weight="600">Campañas y presencia web</text><text x="108" y="676" font-size="17" fill="#9EBBCB" >Captación y comunicación.</text><path class="flow" d="M30 739H450" stroke="#397F90"/><text x="30" y="765" font-size="11" fill="#6FE1E5" class="mono" letter-spacing="1.7" >EN MI RADAR</text><text x="30" y="796" font-size="18" fill="#9EBBCB" >Inteligencia artificial · Nuevas ideas</text><text x="30" y="824" font-size="18" fill="#9EBBCB" >Aprendizaje continuo · Nuevos desafíos</text></svg>
