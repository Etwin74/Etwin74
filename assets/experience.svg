<svg xmlns="http://www.w3.org/2000/svg" width="960" height="568" viewBox="0 0 960 568" fill="none" role="img" aria-labelledby="title">
<title id="title">Experiencia seleccionada: Quirocenter Cieza, ONPE y Gestión Tecnológica y Procesos Chota.</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06131D"/><stop offset=".6" stop-color="#09121D"/><stop offset="1" stop-color="#0A202E"/></linearGradient><radialGradient id="aura"><stop stop-color="#2CDCE9" stop-opacity=".16"/><stop offset="1" stop-color="#2CDCE9" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#68BDCE" stroke-opacity=".055"/></pattern><linearGradient id="fade"><stop stop-color="#57E8EF"/><stop offset="1" stop-color="#57E8EF" stop-opacity="0"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.rotate{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation:spin 29s linear infinite reverse;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 2.1s ease-in-out infinite}.flow{stroke-dasharray:6 13;animation:flow 2.8s linear infinite}.scan{animation:scan 3.3s ease-in-out infinite}.rise{animation:rise 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.delay{animation-delay:-1.8s}.delay2{animation-delay:-3s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-95}}@keyframes scan{50%{transform:translateY(83px);opacity:.3}}@keyframes rise{50%{transform:scaleY(.5)}}@media(prefers-reduced-motion:reduce){.rotate,.reverse,.pulse,.flow,.scan,.rise{animation:none}}</style>
<rect x="0.5" y="0.5" width="959" height="567" rx="10" fill="url(#bg)" stroke="#254250"/><rect x="1" y="1" width="958" height="566" rx="10" fill="url(#grid)"/>
<path d="M18 48V18H48M912 18H942V48M18 520V550H48M912 550H942V520" stroke="#3CB4C7" stroke-opacity=".55"/><circle cx="34" cy="37" r="3" fill="#74F0E3" class="pulse"/><text x="46" y="41" font-size="11" fill="#7DCBD5" class="mono" letter-spacing="1">EXPERIENCIA / SELECCIONADA</text><text x="911" y="41" font-size="11" fill="#7DCBD5" class="mono" letter-spacing="1">03</text><text x="38" y="107" font-size="40" fill="#EFF9FF" font-weight="650">Experiencia profesional.</text><path d="M51 155V473" stroke="#2A5B6A"/><path class="flow" d="M51 155V473" stroke="#62DDE7"/><circle cx="51" cy="177" r="7" fill="#102C39" stroke="#75E0E9"/><circle cx="51" cy="177" r="3" fill="#9CF8F5" class="pulse "/><text x="76" y="181" font-size="11" fill="#7DCBD5" class="mono" letter-spacing="1">JUN 2026 — ACTUALIDAD</text><text x="283" y="181" font-size="28" fill="#E7F8FF" font-weight="600">Quirocenter Cieza</text><text x="283" y="216" font-size="23" fill="#B0C9D7" >Marketing y digitalización</text><text x="283" y="250" font-size="19" fill="#B0C9D7" >Campañas, web y procesos internos.</text><circle cx="51" cy="306" r="7" fill="#102C39" stroke="#75E0E9"/><circle cx="51" cy="306" r="3" fill="#9CF8F5" class="pulse delay"/><text x="76" y="310" font-size="11" fill="#7DCBD5" class="mono" letter-spacing="1">MAR — ABR 2026</text><text x="283" y="310" font-size="28" fill="#E7F8FF" font-weight="600">ONPE · Chota</text><text x="283" y="345" font-size="23" fill="#B0C9D7" >Operador del centro de cómputo</text><text x="283" y="379" font-size="19" fill="#B0C9D7" >Procesamiento y registro de información.</text><circle cx="51" cy="435" r="7" fill="#102C39" stroke="#75E0E9"/><circle cx="51" cy="435" r="3" fill="#9CF8F5" class="pulse delay2"/><text x="76" y="439" font-size="11" fill="#7DCBD5" class="mono" letter-spacing="1">MAR 2022 — FEB 2026</text><text x="283" y="439" font-size="25" fill="#E7F8FF" font-weight="600">Gestión Tecnológica y Procesos Chota</text><text x="283" y="474" font-size="23" fill="#B0C9D7" >Técnico en Sistemas e Informática</text><text x="283" y="508" font-size="19" fill="#B0C9D7" >Soporte técnico y digitalización.</text></svg>
