<text x="38" y="105" font-size="40" fill="#EAF8FF" font-weight="650">Desarrollo y digitalización.</text><text x="38" y="144" font-size="23" fill="#9EBBCB" >Aplicaciones, datos y procesos de negocio.</text><rect x="38" y="179" width="431" height="132" rx="10" fill="#0B1B27" stroke="#234755"/><g transform="translate(57 202)" stroke="#66DCE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="42" height="29" rx="4"/><path d="M0 8H42M14 16L9 20L14 24M27 16L32 20L27 24M23 14L19 26"/><path class="pulse" d="M6 4H12"/></g><text x="116" y="210" font-size="10" fill="#6AB8C8" class="mono" letter-spacing="1.7" >DESARROLLO</text><text x="116" y="240" font-size="24" fill="#E2F2F9" font-weight="600">Web · Móvil · Escritorio</text><text x="116" y="270" font-size="18" fill="#9EBBCB" >Desarrollo de aplicaciones.</text><rect x="491" y="179" width="431" height="132" rx="10" fill="#0B1B27" stroke="#234755"/><g transform="translate(510 202)" fill="#61DBE7"><rect class="rise" y="18" width="7" height="17" rx="2"/><rect class="rise delay" x="13" y="9" width="7" height="26" rx="2"/><rect class="rise delay2" x="26" width="7" height="35" rx="2"/></g><text x="569" y="210" font-size="10" fill="#6AB8C8" class="mono" letter-spacing="1.7" >DATOS</text><text x="569" y="240" font-size="24" fill="#E2F2F9" font-weight="600">Análisis y visualización</text><text x="569" y="270" font-size="18" fill="#9EBBCB" >Organización de información.</text><rect x="38" y="332" width="431" height="132" rx="10" fill="#0B1B27" stroke="#234755"/><g transform="translate(57 355)" stroke="#66DCE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path class="flow" d="M7 6L33 6L20 30Z"/><circle cx="7" cy="6" r="5" fill="#0A1C28"/><circle cx="33" cy="6" r="5" fill="#0A1C28"/><circle class="pulse" cx="20" cy="30" r="5" fill="#0A1C28"/></g><text x="116" y="363" font-size="10" fill="#6AB8C8" class="mono" letter-spacing="1.7" >FORMACIÓN</text><text x="116" y="393" font-size="24" fill="#