<svg xmlns="http://www.w3.org/2000/svg" width="480" height="414" viewBox="0 0 480 414" fill="none" role="img" aria-labelledby="title">
<title id="title">Forma de trabajar: comprender la necesidad, especificar el alcance, desarrollar la solución y validar el resultado.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="480" y2="414" gradientUnits="userSpaceOnUse"><stop stop-color="#08131D"/><stop offset=".58" stop-color="#0A1520"/><stop offset="1" stop-color="#0C202A"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#50D9E5" stop-opacity=".72"/><stop offset=".65" stop-color="#397389" stop-opacity=".12"/><stop offset="1" stop-color="#69DCCF" stop-opacity=".3"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#4DCEDA" stop-opacity=".14"/><stop offset="1" stop-color="#4DCEDA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#67B7C6" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect x="1" y="1" width="478" height="412" rx="14"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}.counter{animation:spin 36s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:4 14;animation:flow 4s linear infinite}.sweep{animation:sweep 4.8s ease-in-out infinite}
.bar{animation:bar 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.d1{animation-delay:-1.1s}.d2{animation-delay:-2.2s}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-90}}@keyframes sweep{50%{transform:translateY(57px);opacity:.2}}@keyframes bar{50%{transform:scaleY(.48)}}
@media(prefers-reduced-motion:reduce){.spin,.counter,.pulse,.flow,.sweep,.bar{animation:none}}
</style>
<rect x="0.5" y="0.5" width="479" height="413" rx="14" fill="url(#bg)" stroke="#28414F"/>
<g clip-path="url(#clip)"><rect width="480" height="414" fill="url(#grid)"/><circle cx="420" cy="394" r="200" fill="url(#aura)"/>
<path d="M28 1H452" fill="none" stroke="url(#edge)"/><path d="M28 413H452" fill="none" stroke="url(#edge)"/>
<path d="M17 43V17H43M437 397H463V371" fill="none" stroke="#63B5C4" stroke-opacity=".45"/>
<circle cx="34" cy="35" r="2.5" fill="#86E6D8" class="pulse"/><text x="47" y="39" font-size="9" fill="#69C6D2" class="mono" letter-spacing="1.2" >PROCESO / DEL PROBLEMA AL RESULTADO</text>
<text x="449" y="39" font-size="10" fill="#588396" class="mono" letter-spacing="1.2" text-anchor="end">05</text>
<text x="28" y="94" font-size="29" fill="#EDF8FF" font-weight="630">Forma de trabajar</text><path d="M47 145V325" fill="none" stroke="#285362" /><path d="M47 145V325" fill="none" class="flow" stroke="#6DCED8"/><circle cx="47" cy="143" r="15" fill="#10303C" stroke="#31697B"/><text x="47" y="146" font-size="9" fill="#8EE2E7" class="mono" letter-spacing="1.2" text-anchor="middle">01</text><text x="80" y="148" font-size="18" fill="#D3EAF4" font-weight="550">Comprender</text><text x="288" y="148" font-size="16" fill="#9BB5C6" >La necesidad.</text><circle cx="47" cy="204" r="15" fill="#10303C" stroke="#31697B"/><text x="47" y="207" font-size="9" fill="#8EE2E7" class="mono" letter-spacing="1.2" text-anchor="middle">02</text><text x="80" y="209" font-size="18" fill="#D3EAF4" font-weight="550">Especificar</text><text x="288" y="209" font-size="16" fill="#9BB5C6" >El alcance.</text><circle cx="47" cy="265" r="15" fill="#10303C" stroke="#31697B"/><text x="47" y="268" font-size="9" fill="#8EE2E7" class="mono" letter-spacing="1.2" text-anchor="middle">03</text><text x="80" y="270" font-size="18" fill="#D3EAF4" font-weight="550">Desarrollar</text><text x="288" y="270" font-size="16" fill="#9BB5C6" >La solución.</text><circle cx="47" cy="326" r="15" fill="#10303C" stroke="#31697B"/><text x="47" y="329" font-size="9" fill="#8EE2E7" class="mono" letter-spacing="1.2" text-anchor="middle">04</text><text x="80" y="331" font-size="18" fill="#D3EAF4" font-weight="550">Validar</text><text x="288" y="331" font-size="16" fill="#9BB5C6" >El resultado.</text><text x="28" y="383" font-size="9" fill="#69C6D2" class="mono" letter-spacing="1.2" >ESPECIFICACIONES + ITERACIÓN</text>
</g></svg>
