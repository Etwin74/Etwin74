<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Josué Saldaña Fustamante — Desarrollo con IA y marketing digital</title>
  <desc id="desc">Interfaz tecnológica oscura con un núcleo circular cian animado. Ideas claras. Sistemas útiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#07131D"/><stop offset=".6" stop-color="#0A101B"/><stop offset="1" stop-color="#081B29"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#24DFF2" stop-opacity=".18"/><stop offset="1" stop-color="#24DFF2" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#4AE4ED"/><stop offset="1" stop-color="#4AE4ED" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#5CACC1" stroke-opacity=".065"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .mono{font-family:'Consolas','Liberation Mono',monospace}.sans{font-family:'Segoe UI',Arial,sans-serif}
    .orbit{transform-origin:971px 190px;animation:orbit 48s linear infinite}.reverse{transform-origin:971px 190px;animation:orbit 70s linear infinite reverse}
    .pulse{animation:pulse 5s ease-in-out infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.48}}
    @media(prefers-reduced-motion:reduce){.orbit,.reverse,.pulse{animation:none}}
  </style>
  <rect x=".5" y=".5" width="1199" height="389" rx="20" fill="url(#bg)" stroke="#1E3948"/>
  <rect x="1" y="1" width="1198" height="388" rx="20" fill="url(#grid)"/>
  <circle cx="971" cy="190" r="222" fill="url(#aura)"/>
