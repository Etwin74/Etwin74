  <circle cx="58" cy="51" r="4" fill="#61F1DB" class="pulse"/>
  <text x="73" y="56" fill="#80A5B5" font-size="12" letter-spacing="2.4" class="mono">ETWIN74 / PERSONAL INTERFACE</text>
  <text x="1143" y="56" fill="#80A5B5" font-size="11" text-anchor="end" letter-spacing="1.5" class="mono">HUMAN × AI</text>
  <text x="54" y="155" fill="#EFFAFF" font-size="76" font-weight="700" letter-spacing="-2" class="sans">JOSUÉ</text>
  <text x="58" y="195" fill="#DAEDF4" font-size="29" letter-spacing="3.3" class="sans">SALDAÑA FUSTAMANTE</text>
  <path d="M58 222H610" stroke="url(#line)"/>
  <text x="58" y="257" fill="#4CE0EC" font-size="21" class="sans">Desarrollo con IA · Marketing digital</text>
  <text x="58" y="289" fill="#9BB6C6" font-size="19" class="sans">Ideas claras. Sistemas útiles.</text>
  <g class="mono" font-size="11" letter-spacing="1.2">
    <rect x="58" y="326" width="173" height="28" rx="5" fill="#0C252E" stroke="#22505B"/>
    <text x="74" y="344" fill="#88EBEE">CODEX AT THE CORE</text>
    <text x="253" y="344" fill="#87A8B8">SPEC → BUILD → ITERATE</text>
  </g>
  <g stroke="#3ACEDD" stroke-opacity=".20"><path d="M693 146H749L777 174H812M693 248H757L789 216H812M971 38V54M971 326V342M803 190H819M1123 190H1139"/><circle cx="689" cy="146" r="3"/><circle cx="689" cy="248" r="3"/></g>
  <circle cx="971" cy="190" r="142" stroke="#256577" stroke-opacity=".45"/>
