  <g class="orbit"><circle cx="971" cy="190" r="119" stroke="#54EAF4" stroke-width="2" stroke-dasharray="185 39 18 39 145 322"/><circle cx="1090" cy="190" r="4" fill="#98FFFF"/></g>
  <g class="reverse"><circle cx="971" cy="190" r="104" stroke="#277587" stroke-width="9" stroke-dasharray="92 38 11 38 92 38 11 333"/><circle cx="971" cy="190" r="92" stroke="#73E8F0" stroke-opacity=".6" stroke-dasharray="140 65 55 318"/></g>
  <circle cx="971" cy="190" r="76" fill="#071924" stroke="#2FC5D6" stroke-opacity=".45"/>
