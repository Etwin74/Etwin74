<svg xmlns="http://www.w3.org/2000/svg" width="960" height="349" viewBox="0 0 960 349" fill="none" role="img" aria-labelledby="title">
<title id="title">Forma de trabajar: comprender, especificar, desarrollar y validar. Interés en el desarrollo guiado por especificaciones y mejora continua.</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06131D"/><stop offset=".6" stop-color="#09121D"/><stop offset="1" stop-color="#0A202E"/></linearGradient><radialGradient id="aura"><stop stop-color="#2CDCE9" stop-opacity=".16"/><stop offset="1" stop-color="#2CDCE9" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#68BDCE" stroke-opacity=".055"/></pattern><linearGradient id="fade"><stop stop-color="#57E8EF"/><stop offset="1" stop-color="#57E8EF" stop-opacity="0"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.rotate{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation:spin 29s linear infinite reverse;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 2.1s ease-in-out infinite}.flow{stroke-dasharray:6 13;animation:flow 2.8s linear infinite}.scan{animation:scan 3.3s ease-in-out infinite}.rise{animation:rise 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.delay{animation-delay:-1.8s}.delay2{animation-delay:-3s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-95}}@keyframes scan{50%{transform:translateY(83px);opacity:.3}}@keyframes rise{50%{transform:scaleY(.5)}}@media(prefers-reduced-motion:reduce){.rotate,.reverse,.pulse,.flow,.scan,.rise{animation:none}}</style>
<rect x="0.5" y="0.5" width="959" height="348" rx="10" fill="url(#bg)" stroke="#254250"/><rect x="1" y="1" width="958" height="347" rx="10" fill="url(#grid)"/>
<path d="M18 48V18H48M912 18H942V48M18 301V331H48M912 331H942V301" stroke="#3CB4C7" stroke-opacity=".55"/>
<circle cx="34" cy="37" r="3" fill="#74F0E3" class="pulse"/><text x="46" y="41" font-size="11" fill="#6AB8C8" class="mono" letter-spacing="1.7" >MÉTODO / PENSAR + HACER</text>
<text x="926" y="41" font-size="11" fill="#688B9E" class="mono" letter-spacing="1.7" text-anchor="end">05</text>
<text x="38" y="102" font-size="40" fill="#E9F7FD" font-weight="650">Del problema a la solución.</text><path d="M80 167H793" stroke="#285A6B"/><path class="flow" d="M80 167H793" stroke="#6AE5EE"/><circle cx="73" cy="167" r="22" fill="#0D2D39" stroke="#4DACBE" class="pulse"/><text x="73" y="172" font-size="12" fill="#86EBF0" class="mono" letter-spacing="1.7" text-anchor="middle">01</text><text x="40" y="225" font-size="27" fill="#E1F2FB" font-weight="600">Comprender</text><text x="40" y="255" font-size="16" fill="#9EBBCB" >La necesidad y su contexto.</text><circle cx="301" cy="167" r="22" fill="#0D2D39" stroke="#4DACBE" class="pulse"/><text x="301" y="172" font-size="12" fill="#86EBF0" class="mono" letter-spacing="1.7" text-anchor="middle">02</text><text x="268" y="225" font-size="27" fill="#E1F2FB" font-weight="600">Especificar</text><text x="268" y="255" font-size="16" fill="#9EBBCB" >Qué debe resolver el producto.</text><circle cx="529" cy="167" r="22" fill="#0D2D39" stroke="#4DACBE" class="pulse"/><text x="529" y="172" font-size="12" fill="#86EBF0" class="mono" letter-spacing="1.7" text-anchor="middle">03</text><text x="496" y="225" font-size="27" fill="#E1F2FB" font-weight="600">Desarrollar</text><text x="496" y="255" font-size="16" fill="#9EBBCB" >Convertir la idea en un sistema.</text><circle cx="757" cy="167" r="22" fill="#0D2D39" stroke="#4DACBE" class="pulse"/><text x="757" y="172" font-size="12" fill="#86EBF0" class="mono" letter-spacing="1.7" text-anchor="middle">05</text><text x="724" y="225" font-size="27" fill="#E1F2FB" font-weight="600">Validar</text><text x="724" y="255" font-size="16" fill="#9EBBCB" >Comprobar, aprender, mejorar.</text><path d="M38 284H920" stroke="#284B5B"/><text x="38" y="319" font-size="11" fill="#67DBE3" class="mono" letter-spacing="1.7" >SPEC-DRIVEN DEVELOPMENT</text><text x="342" y="319" font-size="21" fill="#9EBBCB" >Especificaciones y mejora continua.</text></svg>
